name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (rokit.toml)
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Install Wally packages
        run: wally install

      - name: Format
        run: stylua --check src tests scripts

      - name: Lint
        run: selene src

      - name: Unit tests
        run: lune run tests/run

      - name: Type check (strict)
        run: |
          curl -sSfL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts/globalTypes.d.luau
          rojo sourcemap default.project.json --output sourcemap.json --include-non-scripts
          luau-lsp analyze --platform=roblox --sourcemap=sourcemap.json \
            --definitions=@roblox=globalTypes.d.luau \
            --ignore="ServerPackages/**" --ignore="Packages/**" \
            src

      - name: Build place
        run: rojo build default.project.json --output RollaWeaponRNG.rbxl

      - name: Upload place file
        uses: actions/upload-artifact@v4
        with:
          name: RollaWeaponRNG-place
          path: RollaWeaponRNG.rbxl
